<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 54" width="460" height="54">
  <style>
    .ink { fill: #1b2430; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e6edf3; }
      .eye-ring { fill: #3d444d; }
    }
  </style>
  <!-- 双眼图标（与站点 logo 一致），36 高，垂直居中于 54 高的画布 -->
  <g transform="translate(2, 9)">
    <circle class="eye-ring" cx="18" cy="18" r="17" fill="#DEE2E7"/>
    <circle cx="18" cy="18" r="15.6" fill="#ffffff"/>
    <circle cx="18" cy="22.8" r="5.7" fill="#161616"/>
    <circle cx="21.5" cy="19.2" r="2.1" fill="#ffffff"/>
    <circle class="eye-ring" cx="55" cy="18" r="17" fill="#DEE2E7"/>
    <circle cx="55" cy="18" r="15.6" fill="#ffffff"/>
    <circle cx="55" cy="22.8" r="5.7" fill="#161616"/>
    <circle cx="58.5" cy="19.2" r="2.1" fill="#ffffff"/>
  </g>
  <!-- 标题文字：基线 y=37，28px 字，视觉中心与双眼中心（y=27）对齐 -->
  <text x="86" y="37" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="700" letter-spacing="-0.4">
    <tspan class="ink">remove</tspan><tspan fill="#2f6bff">bg</tspan><tspan class="ink"> · 图片背景消除</tspan>
  </text>
</svg>
